<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Confirm your PayWise account</title>
  </head>
  <body style="margin:0;padding:0;background:#fbfbfa;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#191919;">
    <div style="max-width:520px;margin:0 auto;padding:32px 20px;">
      <h2 style="margin:0 0 12px;font-size:20px;line-height:1.2;">Your PayWise verification code</h2>
      <p style="margin:0 0 18px;font-size:14px;line-height:1.5;color:#4b5563;">
        Enter this 6-digit code in the app to verify your email address.
      </p>

      <div
        style="display:inline-block;padding:14px 18px;border-radius:10px;background:#ffffff;border:1px solid #d3d1cb;"
      >
        <div style="font-size:24px;letter-spacing:6px;font-weight:700;color:#191919;">
          {{ .Token }}
        </div>
      </div>

      <p style="margin:18px 0 0;font-size:12px;line-height:1.5;color:#6b7280;">
        If you didn’t request this, you can safely ignore this email.
      </p>
    </div>
  </body>
</html>
